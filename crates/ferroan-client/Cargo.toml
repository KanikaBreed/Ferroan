[package]
name = "ferroan-client"
description = "Region-side LLUDP circuit, seed capability and event queue"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
axum = "0.8"
ferroan-http = { path = "../ferroan-http" }
ferroan-llsd = { path = "../ferroan-llsd" }
ferroan-protocol = { path = "../ferroan-protocol" }
thiserror = "2.0.21"
tokio = { version = "1", features = ["net", "time"] }
uuid = { version = "1.27.0", features = ["v4"] }

[dev-dependencies]
ferroan-bot = { path = "../../tools/bot" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time"] }

[lints]
workspace = true
