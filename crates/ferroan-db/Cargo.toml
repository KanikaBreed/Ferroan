[package]
name = "ferroan-db"
description = "sqlx pools for Tranquillity's SQLite, MySQL and PostgreSQL schemas"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
ferroan-diag = { path = "../ferroan-diag" }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "sqlite", "mysql", "postgres"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
