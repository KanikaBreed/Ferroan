[package]
name = "ferroan-physics"
description = "Jolt physics for one region, and the heartbeat substep accumulator"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Single precision: `double-precision` stays off. `prebuilt` is required so
# `JOLTC_PREBUILT=require` in `.cargo/config.toml` can use the SHA-checked
# archive. The hashes are recorded beside D8. The safe `oxijolt` crate is not
# a dependency. No other Ferroan crate depends on `oxijolt-sys`.
[dependencies]
oxijolt-sys = { version = "=1.6.0", default-features = false, features = [
    "prebuilt",
    "cross-platform-deterministic",
] }

[dev-dependencies]
serde_json = "1.0.154"

# The workspace forbids unsafe. This crate is the Jolt exception (AGENTS.md
# section 2). `ferroan-scripting` is the other exception once that crate
# exists. Every unsafe block has a SAFETY comment covering ownership,
# lifetime, threading and bounds.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
