[package]
name = "ferroan-scene"
description = "Region terrain and its default rows, scalar prims, region settings, object XML and the frame thread"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.23.1"
ferroan-db = { path = "../ferroan-db" }
ferroan-diag = { path = "../ferroan-diag" }
ferroan-llsd = { path = "../ferroan-llsd" }
ferroan-physics = { path = "../ferroan-physics" }
ferroan-protocol = { path = "../ferroan-protocol" }
ferroan-types = { path = "../ferroan-types" }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
glam = "0.34.1"
log = "0.4"
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "mysql", "postgres", "uuid"] }
thiserror = "2.0.21"
tokio = { version = "1", default-features = false, features = ["sync"] }
tracing = "0.1"
uuid = { version = "1.27.0" }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
uuid = { version = "1.27.0", features = ["serde"] }
ferroan-capture = { path = "../ferroan-capture" }
tokio = { version = "1", features = ["macros", "rt"] }

[lints]
workspace = true
