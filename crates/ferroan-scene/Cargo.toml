[package]
name = "ferroan-scene"
description = "Read-only region terrain, scalar prims and the frame thread"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
ferroan-db = { path = "../ferroan-db" }
ferroan-diag = { path = "../ferroan-diag" }
ferroan-llsd = { path = "../ferroan-llsd" }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
log = "0.4"
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "mysql", "postgres", "uuid"] }
thiserror = "2.0.21"
uuid = { version = "1.27.0" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

[lints]
workspace = true
