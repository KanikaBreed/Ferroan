[package]
name = "ferroan-services"
description = "Grid services. This crate holds the asset service, the user-account service (including user aliases), authentication, the grid-user service, and the avatar service."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
axum = "0.8"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
ferroan-config = { path = "../ferroan-config" }
ferroan-diag = { path = "../ferroan-diag" }
ferroan-db = { path = "../ferroan-db" }
ferroan-http = { path = "../ferroan-http" }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
md-5 = "0.10.6"
sha1 = "0.10.6"
sha2 = "0.10.9"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "mysql", "postgres", "uuid"] }
thiserror = "2.0.21"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1"
uuid = { version = "1.27.0", features = ["v4"] }

[dev-dependencies]
serde_json = "1.0.154"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
