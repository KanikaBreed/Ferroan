[package]
name = "ferroan-robust"
description = "Grid services process. This build serves assets and user accounts."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
axum = "0.8"
ferroan-config = { path = "../ferroan-config" }
ferroan-http = { path = "../ferroan-http" }
ferroan-log = { path = "../ferroan-log" }
ferroan-services = { path = "../ferroan-services" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tracing = "0.1"

[lints]
workspace = true
