# Switch the compose collector to this file to send logs, metrics and traces
# to SigNoz. Ferroan stays the same.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:4318

processors:
  batch:
    timeout: 1s

exporters:
  otlphttp/signoz:
    endpoint: http://signoz:4318

service:
  pipelines:
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/signoz]
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/signoz]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/signoz]
