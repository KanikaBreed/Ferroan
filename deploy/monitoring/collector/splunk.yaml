# Splunk HTTP Event Collector. Replace the token below with the collector's
# token. The placeholder is not a credential.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:4318

processors:
  batch:
    timeout: 1s

exporters:
  splunk_hec:
    endpoint: https://splunk:8088/services/collector
    token: local-validate-token
    tls:
      insecure: true

service:
  pipelines:
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [splunk_hec]
