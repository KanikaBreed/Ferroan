# Switch the compose collector to this file to send logs to OpenSearch.
# Ferroan stays the same: it still posts OTLP to the collector.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:4318

processors:
  batch:
    timeout: 1s

exporters:
  opensearch:
    http:
      endpoint: http://opensearch:9200
    logs_index: ferroan-logs

service:
  pipelines:
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [opensearch]
