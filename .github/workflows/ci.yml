name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Rust
        run: |
          rustup show
          rustc --version
          cargo clippy --version
      - name: Classify the pull request
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: cargo xtask ci scope
      - name: Check documentation and Rust workspace
        if: steps.scope.outputs.docs_only != 'true'
        run: cargo xtask check
      - name: Check documentation only
        if: steps.scope.outputs.docs_only == 'true'
        run: cargo xtask check --docs-only
      - name: Build container images
        if: runner.os == 'Linux' && steps.scope.outputs.docs_only != 'true'
        run: cargo xtask docker build
