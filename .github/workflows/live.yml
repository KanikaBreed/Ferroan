name: Live harness

on:
  # Every pull request: main requires this check before a merge.
  pull_request:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: live scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Classify the pull request
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash tools/ci/classify_pr.sh

  scenarios:
    name: live scenarios
    needs: scope
    if: needs.scope.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up the live runner
        uses: ./.github/actions/live-setup
        with:
          # The publish steps share xtask/src/live.rs with the scenario
          # runners. Hashing that file keeps the warm publish tree; a narrower
          # key would miss it. See docs/LIVE.md.
          tranquillity-key: tranquillity-${{ hashFiles('docs/REFERENCES.md', 'tools/capture/tranquillity-capture.patch', 'xtask/src/live.rs') }}
          rust-key: rust-live-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          rust-restore: rust-live-${{ runner.os }}-
      - name: Verify the oracles
        run: |
          set -euo pipefail
          cargo xtask oracle verify
          cargo xtask schema verify
          cargo xtask config verify
          cargo xtask http verify
          cargo xtask http status-verify
          cargo xtask asset verify
          cargo xtask pin3 verify
      - name: Run the live harness
        run: |
          set -euo pipefail
          cargo xtask live build
          cargo xtask live record-twice
          cargo xtask live run all
          cargo xtask live run all grid
      - name: Check seed and held event polls against C# and Ferroan
        run: |
          set -euo pipefail
          cargo xtask live run caps grid
          cargo xtask live run caps grid --region ferroan
      - name: Upload live logs and diagnostic dumps
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: live-logs-scenarios
          path: |
            .scratch/live/**/*.log
            .scratch/live/diag/**
          if-no-files-found: ignore
          include-hidden-files: true

  ferrobot:
    name: live ferrobot
    needs: scope
    if: needs.scope.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up the live runner
        uses: ./.github/actions/live-setup
        with:
          tranquillity-key: tranquillity-${{ hashFiles('docs/REFERENCES.md', 'tools/capture/tranquillity-capture.patch', 'xtask/src/live.rs') }}
          rust-key: rust-live-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          rust-restore: rust-live-${{ runner.os }}-
      - name: Check Ferrobot in standalone and mixed grids
        run: |
          set -euo pipefail
          cargo xtask live run ferrobot
          cargo xtask live run ferrobot grid
          cargo xtask live run ferrobot grid --region ferroan
      - name: Upload live logs and diagnostic dumps
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: live-logs-ferrobot
          path: |
            .scratch/live/**/*.log
            .scratch/live/diag/**
          if-no-files-found: ignore
          include-hidden-files: true

  services:
    name: live services
    needs: scope
    if: needs.scope.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up the live runner
        uses: ./.github/actions/live-setup
        with:
          tranquillity-key: tranquillity-${{ hashFiles('docs/REFERENCES.md', 'tools/capture/tranquillity-capture.patch', 'xtask/src/live.rs') }}
          rust-key: rust-live-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          rust-restore: rust-live-${{ runner.os }}-
      - name: Check login through Robust onto the Ferroan region
        run: cargo xtask live run login grid --region ferroan
      - name: Trip POST-body, datagram and fetch-folder limits
        run: cargo xtask live run limits grid --region ferroan
      - name: Compare inventory and texture caps on the Ferroan region
        run: cargo xtask live run assets grid --region ferroan
      - name: Run grid mode with the Rust asset service
        run: cargo xtask live run assets grid --rust assets --db sqlite
      - name: Check login with the Rust user account service
        run: cargo xtask live run login grid --rust accounts
      - name: Check login with Rust assets and user accounts
        run: cargo xtask live run login grid --rust assets,accounts
      - name: Compare C# and Ferroan asset services
        run: cargo xtask live compare assets
      - name: Compare C# and Ferroan user account services
        run: cargo xtask live compare accounts
      - name: Check persistent mixed-grid login, relogin and cleanup
        run: cargo xtask live persistent-grid-check
      - name: Check the persistent Ferroan asset setup
        run: |
          set -euo pipefail
          cargo xtask live up --assets ferroan
          cargo xtask live run assets --running
      - name: Stop the persistent region and asset service
        if: always()
        run: cargo xtask live down
      - name: Build OpenSim.ConsoleClient and read a Ferroan console
        if: success()
        run: cargo xtask console-client
      - name: Upload live logs and diagnostic dumps
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: live-logs-services
          path: |
            .scratch/live/**/*.log
            .scratch/live/diag/**
          if-no-files-found: ignore
          include-hidden-files: true

  # Images and docker smoke stay in this one job. A later change moves the
  # whole job; it does not split the smoke step away from the image build.
  images:
    name: live images
    needs: scope
    if: needs.scope.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up the live runner
        uses: ./.github/actions/live-setup
        with:
          tranquillity-key: tranquillity-${{ hashFiles('docs/REFERENCES.md', 'tools/capture/tranquillity-capture.patch', 'xtask/src/live.rs') }}
          rust-key: rust-live-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          rust-restore: rust-live-${{ runner.os }}-
      - name: Build images and smoke the example grid
        if: success()
        run: cargo xtask docker smoke
      - name: Upload live logs and diagnostic dumps
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: live-logs-images
          path: |
            .scratch/live/**/*.log
            .scratch/live/diag/**
          if-no-files-found: ignore
          include-hidden-files: true

  live:
    name: live (ubuntu-latest)
    needs: [scope, scenarios, ferrobot, services, images]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: tools/ci
          sparse-checkout-cone-mode: false
      - name: Fail unless every live job succeeded
        env:
          SCOPE: ${{ needs.scope.result }}
          DOCS_ONLY: ${{ needs.scope.outputs.docs_only }}
          SCENARIOS: ${{ needs.scenarios.result }}
          FERROBOT: ${{ needs.ferrobot.result }}
          SERVICES: ${{ needs.services.result }}
          IMAGES: ${{ needs.images.result }}
        run: bash tools/ci/live_gate.sh
