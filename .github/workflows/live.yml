name: Live harness

on:
  # Every pull request: main requires this check before a merge.
  pull_request:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: live scope
    runs-on: ubuntu-latest
    # A cache miss compiles xtask before the work jobs start.
    timeout-minutes: 15
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Rust
        run: rustup show
      - name: Restore the Rust build
        uses: actions/cache/restore@a7833574556fa59680c1b7cb190c1735db73ebf0 # v5.0.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: rust-live-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'xtask/**') }}
          restore-keys: |
            rust-live-${{ runner.os }}-
      - name: Classify the pull request
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: cargo xtask ci scope

  scenarios:
    name: live scenarios
    needs: scope
    if: needs.scope.outputs.docs_only != 'true'
    runs-on: ${{ vars.FERROAN_SELF_HOSTED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","ferroan"]') || 'ubuntu-latest' }}
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up the live runner
        uses: ./.github/actions/live-setup
        with:
          # The publish steps share xtask/src/live.rs with the scenario
          # runners. Hashing that file keeps the warm publish tree; a narrower
          # key would miss it. See docs/LIVE.md.
          tranquillity-key: tranquillity-${{ hashFiles('docs/REFERENCES.md', 'tools/capture/tranquillity-capture.patch', 'xtask/src/live.rs') }}
          rust-key: rust-live-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'xtask/**') }}
          rust-restore: rust-live-${{ runner.os }}-
      - name: Choose this job's port base
        run: |
          set -euo pipefail
          base="$(cargo xtask ci live-port-base --offset 0)"
          echo "FERROAN_LIVE_PORT_BASE=${base}" >> "$GITHUB_ENV"
          echo "live port base ${base}"
      - name: Verify the oracles
        run: |
          set -euo pipefail
          cargo xtask oracle verify
          cargo xtask schema verify
          cargo xtask config verify
          cargo xtask http verify
          cargo xtask http status-verify
          cargo xtask asset verify
          cargo xtask pin3 verify
          cargo xtask access verify
      - name: Run the live harness
        run: |
          set -euo pipefail
          cargo xtask live build
          cargo xtask live record-twice
          cargo xtask live run all
          cargo xtask live run all grid
          cargo xtask live run neighbour grid
      - name: Check seed and held event polls against C# and Ferroan
        run: |
          set -euo pipefail
          cargo xtask live run caps grid
          cargo xtask live run caps grid --region ferroan
      - name: Stop live processes and containers
        if: always()
        uses: ./.github/actions/live-cleanup
        with:
          offset: "0"
      - name: Upload live logs and diagnostic dumps
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: live-logs-scenarios
          path: |
            .scratch/live/**/*.log
            .scratch/live/diag/**
          if-no-files-found: ignore
          include-hidden-files: true

  ferrobot:
    name: live ferrobot
    needs: scope
    if: needs.scope.outputs.docs_only != 'true'
    runs-on: ${{ vars.FERROAN_SELF_HOSTED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","ferroan"]') || 'ubuntu-latest' }}
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up the live runner
        uses: ./.github/actions/live-setup
        with:
          tranquillity-key: tranquillity-${{ hashFiles('docs/REFERENCES.md', 'tools/capture/tranquillity-capture.patch', 'xtask/src/live.rs') }}
          rust-key: rust-live-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'xtask/**') }}
          rust-restore: rust-live-${{ runner.os }}-
      - name: Choose this job's port base
        run: |
          set -euo pipefail
          base="$(cargo xtask ci live-port-base --offset 32)"
          echo "FERROAN_LIVE_PORT_BASE=${base}" >> "$GITHUB_ENV"
          echo "live port base ${base}"
      - name: Check Ferrobot in standalone and mixed grids
        run: |
          set -euo pipefail
          # Standalone Ferrobot does not build the region. The old single job
          # ran `live build` earlier; a cache miss leaves no binary here.
          cargo xtask live build
          cargo xtask live run ferrobot
          cargo xtask live run ferrobot grid
          cargo xtask live run ferrobot grid --region ferroan
      - name: Stop live processes and containers
        if: always()
        uses: ./.github/actions/live-cleanup
        with:
          offset: "32"
      - name: Upload live logs and diagnostic dumps
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: live-logs-ferrobot
          path: |
            .scratch/live/**/*.log
            .scratch/live/diag/**
          if-no-files-found: ignore
          include-hidden-files: true

  services:
    name: live services
    needs: scope
    if: needs.scope.outputs.docs_only != 'true'
    # MySQL and PostgreSQL are started in a step, not with a services block.
    # The host ports come from the run id, so two services jobs on one machine
    # do not share 3306 or 5432, and the cleanup step can remove the containers
    # after cancellation. The clients are the ones in those images, so the job
    # does not install database clients. The local schema containers stay on
    # 13306 and 15432.
    runs-on: ${{ vars.FERROAN_SELF_HOSTED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","ferroan"]') || 'ubuntu-latest' }}
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up the live runner
        uses: ./.github/actions/live-setup
        with:
          tranquillity-key: tranquillity-${{ hashFiles('docs/REFERENCES.md', 'tools/capture/tranquillity-capture.patch', 'xtask/src/live.rs') }}
          rust-key: rust-live-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'xtask/**') }}
          rust-restore: rust-live-${{ runner.os }}-
      - name: Choose this job's port base
        run: |
          set -euo pipefail
          base="$(cargo xtask ci live-port-base --offset 64)"
          echo "FERROAN_LIVE_PORT_BASE=${base}" >> "$GITHUB_ENV"
          echo "live port base ${base}"
      - name: Check login through Robust onto the Ferroan region
        run: cargo xtask live run login grid --region ferroan
      - name: Admit two root agents on the Ferroan region
        run: cargo xtask live run roots grid --region ferroan
      - name: Hear channel 0 chat on the Ferroan region
        run: cargo xtask live run chat grid --region ferroan
      - name: Teleport inside the Ferroan region
        run: cargo xtask live run teleport grid --region ferroan
      - name: Teleport from the Ferroan region onto the C# neighbour
        run: cargo xtask live run hop grid --region ferroan
      - name: Trip POST-body, datagram and fetch-folder limits
        run: cargo xtask live run limits grid --region ferroan
      - name: Compare inventory and texture caps on the Ferroan region
        run: cargo xtask live run assets grid --region ferroan
      - name: Run grid mode with the Rust asset service
        run: cargo xtask live run assets grid --rust assets --db sqlite
      - name: Check login with the Rust user account service
        run: cargo xtask live run login grid --rust accounts
      - name: Check login with Rust assets and user accounts
        run: cargo xtask live run login grid --rust assets,accounts
      - name: Check login with the Rust authentication service
        run: cargo xtask live run login grid --rust auth
      - name: Compare C# and Ferroan asset services
        run: cargo xtask live compare assets
      - name: Compare C# and Ferroan user account services
        run: cargo xtask live compare accounts
      - name: Compare C# and Ferroan authentication services
        run: cargo xtask live compare auth
      - name: Check persistent mixed-grid login, relogin and cleanup
        run: cargo xtask live persistent-grid-check
      - name: Check the persistent Ferroan asset setup
        run: |
          set -euo pipefail
          cargo xtask live up --assets ferroan
          cargo xtask live run assets --running
      - name: Stop the persistent region and asset service
        if: always()
        run: cargo xtask live down
      - name: Build OpenSim.ConsoleClient and read a Ferroan console
        if: success()
        run: cargo xtask console-client
      - name: Compare the remote console's four forms with the C# region
        if: success()
        run: cargo xtask console-forms
      - name: Start MySQL 8.4 and PostgreSQL 16
        if: success()
        run: |
          set -euo pipefail
          read -r mysql_port postgres_port < <(cargo xtask ci live-db-ports)
          echo "FERROAN_CI_MYSQL_PORT=${mysql_port}" >> "$GITHUB_ENV"
          echo "FERROAN_CI_POSTGRES_PORT=${postgres_port}" >> "$GITHUB_ENV"
          {
            echo "FERROAN_MYSQL_URL=mysql://ferroan:ferroan@127.0.0.1:${mysql_port}/ferroan?ssl-mode=disabled"
            echo "FERROAN_POSTGRES_URL=postgres://ferroan:ferroan@127.0.0.1:${postgres_port}/ferroan?sslmode=disable"
          } >> "$GITHUB_ENV"
          mysql_name="ferroan-ci-mysql-${mysql_port}"
          postgres_name="ferroan-ci-postgres-${postgres_port}"
          docker rm -f "$mysql_name" "$postgres_name" >/dev/null 2>&1 || true
          docker run -d --name "$mysql_name" \
            -p "127.0.0.1:${mysql_port}:3306" \
            -e MYSQL_ROOT_PASSWORD=ferroan \
            -e MYSQL_USER=ferroan \
            -e MYSQL_PASSWORD=ferroan \
            -e MYSQL_DATABASE=ferroan \
            mysql:8.4
          docker run -d --name "$postgres_name" \
            -p "127.0.0.1:${postgres_port}:5432" \
            -e POSTGRES_USER=ferroan \
            -e POSTGRES_PASSWORD=ferroan \
            -e POSTGRES_DB=ferroan \
            postgres:16
          ready=0
          mysql_err="$(mktemp)"
          postgres_err="$(mktemp)"
          for _ in $(seq 1 40); do
            # The asset commands connect to the published host port. A client
            # inside the server container is a different path. A fresh
            # caching_sha2 account rejects the first TLS-disabled client
            # unless that client asks for the server public key.
            if docker run --rm --network host mysql:8.4 mysql --protocol=TCP -h 127.0.0.1 -P "$mysql_port" -uferroan -pferroan --ssl-mode=DISABLED --get-server-public-key -e "SELECT 1" ferroan >"$mysql_err" 2>&1 \
              && docker exec -e PGPASSWORD=ferroan "$postgres_name" psql -h 127.0.0.1 -U ferroan -d ferroan -c "SELECT 1" >"$postgres_err" 2>&1; then
              ready=1
              break
            fi
            sleep 5
          done
          if [ "$ready" -ne 1 ]; then
            echo "mysql probe:"
            tail -n 20 "$mysql_err" || true
            echo "postgres probe:"
            tail -n 20 "$postgres_err" || true
            docker logs --tail 40 "$mysql_name" || true
            docker logs --tail 40 "$postgres_name" || true
            rm -f "$mysql_err" "$postgres_err"
            exit 1
          fi
          rm -f "$mysql_err" "$postgres_err"
          echo "database ports mysql ${mysql_port} postgres ${postgres_port}"
      - name: Load schemas for the XAsset compare
        if: success()
        run: |
          set -euo pipefail
          docker run --rm -i --network host mysql:8.4 \
            mysql --protocol=TCP -h 127.0.0.1 -P "${FERROAN_CI_MYSQL_PORT}" -uferroan -pferroan --ssl-mode=DISABLED --get-server-public-key ferroan \
            < fixtures/db/mysql/schema.sql
          docker exec -i -e PGPASSWORD=ferroan \
            "ferroan-ci-postgres-${FERROAN_CI_POSTGRES_PORT}" \
            psql -h 127.0.0.1 -U ferroan -d ferroan -v ON_ERROR_STOP=1 \
            < fixtures/db/postgres/schema.sql
      - name: Compare XAsset on MySQL
        if: success()
        run: cargo xtask live assets --backend xasset --db mysql
      - name: Compare XAsset on PostgreSQL
        if: success()
        run: cargo xtask live assets --backend xasset --db pgsql
      - name: Compare FSAssets on MySQL
        if: success()
        run: cargo xtask live assets --backend fsassets --db mysql
      - name: Compare FSAssets on PostgreSQL
        if: success()
        run: cargo xtask live assets --backend fsassets --db pgsql
      - name: Stop live processes and containers
        if: always()
        uses: ./.github/actions/live-cleanup
        with:
          offset: "64"
          databases: "true"
      - name: Upload live logs and diagnostic dumps
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: live-logs-services
          path: |
            .scratch/live/**/*.log
            .scratch/live/diag/**
          if-no-files-found: ignore
          include-hidden-files: true

  # Images and docker smoke stay in this one job. Do not split them.
  # The runner condition matches scenarios, ferrobot and services. A port base
  # isolates smoke, so there is no machine-wide concurrency group. One runner
  # instance queues a waiting job. It does not drop that job.
  images:
    name: live images
    needs: scope
    if: needs.scope.outputs.docs_only != 'true'
    runs-on: ${{ vars.FERROAN_SELF_HOSTED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","ferroan"]') || 'ubuntu-latest' }}
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up the live runner
        uses: ./.github/actions/live-setup
        with:
          tranquillity-key: tranquillity-${{ hashFiles('docs/REFERENCES.md', 'tools/capture/tranquillity-capture.patch', 'xtask/src/live.rs') }}
          rust-key: rust-live-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'xtask/**') }}
          rust-restore: rust-live-${{ runner.os }}-
      - name: Choose this job's port base
        run: |
          set -euo pipefail
          base="$(cargo xtask ci live-port-base --offset 96)"
          echo "FERROAN_LIVE_PORT_BASE=${base}" >> "$GITHUB_ENV"
          echo "live port base ${base}"
      - name: Build images and smoke the example grid
        if: success()
        run: cargo xtask docker smoke
      - name: Stop live processes and containers
        if: always()
        uses: ./.github/actions/live-cleanup
        with:
          offset: "96"
      - name: Upload live logs and diagnostic dumps
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: live-logs-images
          path: |
            .scratch/live/**/*.log
            .scratch/live/diag/**
          if-no-files-found: ignore
          include-hidden-files: true

  live:
    name: live (ubuntu-latest)
    needs: [scope, scenarios, ferrobot, services, images]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Rust
        run: rustup show
      - name: Restore the Rust build
        uses: actions/cache/restore@a7833574556fa59680c1b7cb190c1735db73ebf0 # v5.0.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: rust-live-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'xtask/**') }}
          restore-keys: |
            rust-live-${{ runner.os }}-
      - name: Fail unless every live job succeeded
        env:
          SCOPE: ${{ needs.scope.result }}
          DOCS_ONLY: ${{ needs.scope.outputs.docs_only }}
          SCENARIOS: ${{ needs.scenarios.result }}
          FERROBOT: ${{ needs.ferrobot.result }}
          SERVICES: ${{ needs.services.result }}
          IMAGES: ${{ needs.images.result }}
        run: cargo xtask ci gate
