name: Live harness

on:
  # Every pull request: main requires this check before a merge.
  pull_request:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live:
    name: live (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Rust
        run: rustup show
      - name: Set up .NET SDK 10
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.114
      - name: Install sqlite3
        run: sudo apt-get update && sudo apt-get install -y sqlite3
      - name: Check out the pinned references
        run: |
          set -euo pipefail
          pin() {
            awk -v name="$1" -F'|' '
              index($0, "`" name "`") {
                for (i = 1; i <= NF; i++) {
                  if ($i ~ /[0-9a-f]{40}/) {
                    gsub(/[^0-9a-f]/, "", $i)
                    print $i
                    exit
                  }
                }
              }
            ' docs/REFERENCES.md
          }
          clone_at() {
            local url="$1" dest="$2" rev="$3"
            rm -rf "$dest"
            mkdir -p "$(dirname "$dest")"
            # Full history. Nerdbank.GitVersioning, which libopenmetaverse
            # uses, refuses a shallow clone when it computes version height.
            git clone "$url" "$dest"
            git -C "$dest" checkout --detach "$rev"
          }
          repository() {
            awk -v name="$1" -F'|' '
              index($0, "`" name "`") {
                if (match($3, /https:\/\/github.com\/[^)]+/)) {
                  print substr($3, RSTART, RLENGTH) ".git"
                  exit
                }
              }
            ' docs/REFERENCES.md
          }
          tranq="$(pin OpenSim-Tranquillity)"
          meta="$(pin libopenmetaverse)"
          ferrobot="$(pin Ferrobot)"
          test -n "$tranq" && test -n "$meta" && test -n "$ferrobot"
          root="${RUNNER_TEMP}/ferroan-ref"
          clone_at "$(repository OpenSim-Tranquillity)" \
            "$root/OpenSim-Tranquillity" "$tranq"
          clone_at "$(repository libopenmetaverse)" \
            "$root/libopenmetaverse" "$meta"
          clone_at "$(repository Ferrobot)" \
            "$root/Ferrobot" "$ferrobot"
          echo "FERROAN_REF=$root" >> "$GITHUB_ENV"
      - name: Restore the Tranquillity build
        uses: actions/cache@a7833574556fa59680c1b7cb190c1735db73ebf0 # v5.0.0
        with:
          path: |
            .scratch/live/stamp
            .scratch/live/src
          key: tranquillity-${{ hashFiles('docs/REFERENCES.md', 'tools/capture/tranquillity-capture.patch', 'xtask/src/live.rs') }}
      - name: Verify the oracles
        run: |
          set -euo pipefail
          cargo xtask oracle verify
          cargo xtask schema verify
          cargo xtask config verify
          cargo xtask http verify
          cargo xtask asset verify
          cargo xtask pin3 verify
      - name: Run the live harness
        run: |
          set -euo pipefail
          cargo xtask live build
          cargo xtask live run all
          cargo xtask live run all grid
      - name: Check login through Robust onto the Ferroan region
        run: cargo xtask live run login grid --region ferroan
      - name: Check seed and held event polls against C# and Ferroan
        run: |
          set -euo pipefail
          cargo xtask live run caps grid
          cargo xtask live run caps grid --region ferroan
      - name: Compare inventory and texture caps on the Ferroan region
        run: cargo xtask live run assets grid --region ferroan
      - name: Check Ferrobot in standalone and mixed grids
        run: |
          set -euo pipefail
          cargo xtask live run ferrobot
          cargo xtask live run ferrobot grid
          cargo xtask live run ferrobot grid --region ferroan
      - name: Run grid mode with the Rust asset service
        run: cargo xtask live run assets grid --rust assets --db sqlite
      - name: Compare C# and Ferroan asset services
        run: cargo xtask live compare assets
      - name: Compare C# and Ferroan user account services
        run: cargo xtask live compare accounts
      - name: Check persistent mixed-grid login, relogin and cleanup
        run: cargo xtask live persistent-grid-check
      - name: Check the persistent Ferroan asset setup
        run: |
          set -euo pipefail
          cargo xtask live up --assets ferroan
          cargo xtask live run assets --running
      - name: Stop the persistent region and asset service
        if: always()
        run: cargo xtask live down
