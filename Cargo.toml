[workspace]
members = [
    "crates/ferroan-types",
    "crates/ferroan-db",
    "crates/ferroan-config",
    "crates/ferroan-llsd",
    "crates/ferroan-http",
    "crates/ferroan-protocol",
    "crates/ferroan-services",
    "crates/ferroan-robust",
    "crates/ferroan-capture",
    "tools/bot",
    "xtask",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/KanikaBreed/Ferroan"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
