[package]
name = "xtask"
description = "Repository tasks for Ferroan: cargo xtask check, oracle, schema, config, http, asset and live"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
ferroan-bot = { path = "../tools/bot" }
ferroan-capture = { path = "../crates/ferroan-capture" }
ferroan-http = { path = "../crates/ferroan-http" }
ferroan-llsd = { path = "../crates/ferroan-llsd" }
ferroan-protocol = { path = "../crates/ferroan-protocol" }
serde_json = { version = "1", features = ["preserve_order"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-util"] }
uuid = { version = "1.27.0", features = ["v4"] }

[lints]
workspace = true
