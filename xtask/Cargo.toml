[package]
name = "xtask"
description = "Repository tasks for Ferroan: cargo xtask check, oracle, schema, config, http, asset, live and ci"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
ferroan-bot = { path = "../tools/bot" }
ferroan-log = { path = "../crates/ferroan-log" }
ferroan-capture = { path = "../crates/ferroan-capture" }
ferroan-diag = { path = "../crates/ferroan-diag" }
ferroan-http = { path = "../crates/ferroan-http" }
ferroan-llsd = { path = "../crates/ferroan-llsd" }
ferroan-protocol = { path = "../crates/ferroan-protocol" }
ferroan-scene = { path = "../crates/ferroan-scene" }
serde_json = { version = "1", features = ["preserve_order"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }
sha1 = "0.10.6"
sha2 = "0.10.9"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "registry", "std"] }
uuid = { version = "1.27.0", features = ["v4"] }

[lints]
workspace = true
